name: Update snow data

# Runs twice a day and scrapes at 7:00 am and 6:00 pm Alberta Time.
# GitHub starts scheduled jobs late by a variable amount (55-85 minutes in the morning,
# 40-50 in the evening). So each job is queued well ahead of its target, installs everything,
# then waits (at most 100 minutes) until exactly 7:00 am / 6:00 pm before scraping.
# Alberta uses Alberta Time (UTC-6 all year, no clock changes) from 1 Nov 2026, so the
# slots are fixed in UTC. The "Decide whether to run" step skips a run outside the windows
# or one that follows another within 3 hours.
on:
  schedule:
    - cron: "23 11 * * *"   # queued 5:23 am Alberta Time (UTC-6); waits until 7:00 am
    - cron: "43 22 * * *"   # queued 4:43 pm Alberta Time (UTC-6); waits until 6:00 pm
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, os, sys

          def calgary_offset_hours(utc):
              """Alberta Time (ABT) is UTC-6 all year (no daylight saving from 1 Nov 2026)."""
              return -6

          now = dt.datetime.now(dt.timezone.utc)
          if os.environ.get("FAKE_NOW"):            # only used for testing
              now = dt.datetime.fromisoformat(os.environ["FAKE_NOW"])
          local = now + dt.timedelta(hours=calgary_offset_hours(now))
          mins = local.hour * 60 + local.minute
          in_window = (5 * 60 <= mins < 10 * 60) or (16 * 60 <= mins < 21 * 60)
          recent = False
          try:
              last = dt.datetime.fromisoformat(json.load(open("snow.json"))["updated"])
              recent = (now - last).total_seconds() < 3 * 3600
          except Exception:
              pass
          manual = os.environ.get("EVENT") == "workflow_dispatch"
          run = manual or (in_window and not recent)
          print(f"local={local:%H:%M} window={in_window} recent={recent} manual={manual} -> run={run}", file=sys.stderr)
          print("run=" + str(run).lower())
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: Install headless browser
        if: steps.gate.outputs.run == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Wait for 7:00 am / 6:00 pm
        if: steps.gate.outputs.run == 'true' && github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import datetime as dt, time
          local = dt.datetime.now(dt.timezone.utc) + dt.timedelta(hours=-6)   # Alberta Time
          mins = local.hour * 60 + local.minute
          target = 7 * 60 if mins < 12 * 60 else 18 * 60
          wait = (target - mins) * 60 - local.second
          if 0 < wait <= 100 * 60:
              print(f"Started {local:%H:%M}; waiting {wait // 60} min until the target time")
              time.sleep(wait)
          else:
              print(f"Started {local:%H:%M}; no wait needed")
          PY

      - name: Run scraper
        if: steps.gate.outputs.run == 'true'
        run: python scraper.py snow.json

      - name: Commit snow.json
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "snow-bot"
          git config user.email "snow-bot@users.noreply.github.com"
          git add snow.json
          git commit -m "Update snow data" || echo "No changes"
          git push
