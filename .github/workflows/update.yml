name: Update snow data

on:
  schedule:
    - cron: "15 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py snow.json

      - name: Commit snow.json
        run: |
          git config user.name "snow-bot"
          git config user.email "snow-bot@users.noreply.github.com"
          git add snow.json
          git commit -m "Update snow data" || echo "No changes"
          git push

